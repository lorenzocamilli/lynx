name: Build and Test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "1.25"]
    name: Go ${{ matrix.go }} - Build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/admin/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: make build
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "1.25"]
    name: Go ${{ matrix.go }} - Test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-
      # noembed: skip the //go:embed of the admin UI (a build artifact) so the
      # Go tests don't require `make build-admin` first. The build job above
      # exercises the real embed via `make build`.
      - run: go test -tags noembed -coverprofile=coverage.out -covermode=atomic ./cmd/... ./pkg/...
      - run: go tool cover -func=coverage.out
      # Coverage is only meaningfully comparable across a single Go version;
      # upload once (matrix.go == "1.25", the project's primary version) to
      # avoid two profiles silently overwriting each other under the same
      # artifact name.
      - if: matrix.go == '1.25'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.out
  test-race:
    runs-on: ubuntu-latest
    name: Go - Race Detector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
        with:
          go-version: "1.25"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-race-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-
      - run: go test -race -tags noembed ./cmd/... ./pkg/...
  govulncheck:
    runs-on: ubuntu-latest
    name: Go - Vulnerability Check
    # Non-blocking for now: govulncheck reports GO-2024-2920 (a DoS in gqlparser)
    # reachable only via the localhost- and token-bound admin GraphQL API. It is
    # pulled in through the pinned gqlgen v0.14; the real fix is the gqlgen
    # v0.14 -> v0.17 upgrade (tracked in PLAN.md, "F1"). Until then the job still
    # runs and surfaces findings but does not fail the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
        with:
          go-version: "1.25"
          # Always resolve the newest 1.25.x patch release instead of the
          # runner's preinstalled toolchain, so stdlib vulnerabilities fixed
          # in patch releases (e.g. GO-2026-5856 in crypto/tls, fixed in
          # 1.25.12) don't show up as findings against an outdated stdlib.
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck -tags noembed ./cmd/... ./pkg/...
