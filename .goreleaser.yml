version: 2

before:
  hooks:
    - make clean
    - sh -c "NEXT_PUBLIC_VERSION={{ .Version }} make build-admin"
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/lynx
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

dockers:
  - extra_files:
      - go.mod
      - go.sum
      - pkg
      - cmd
      - admin
    image_templates:
      - "ghcr.io/lorenzocamilli/lynx:{{ .Version }}"
      - "ghcr.io/lorenzocamilli/lynx:{{ .Major }}"
      - "ghcr.io/lorenzocamilli/lynx:{{ .Major }}.{{ .Minor }}"
      - "ghcr.io/lorenzocamilli/lynx:latest"
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/lorenzocamilli/lynx"
      - "--build-arg=LYNX_VERSION={{ .Version }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: lorenzocamilli
    name: lynx
  prerelease: auto
